<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayU concept: Failed payments, recovered</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4ef; font-family: Inter, system-ui, sans-serif; color: #2e3340; }
      .wrap { text-align: center; padding: 24px; }
      .phone { position: relative; height: 18rem; width: 10rem; overflow: hidden; border-radius: 2.2rem; border: 7px solid #2e3340; background: #fff; box-shadow: 0 20px 25px -5px rgb(0 0 0 / .1); margin: 0 auto; }
      .phone > div { height: 100%; }
      .absolute { position: absolute; } .relative { position: relative; } .h-full { height: 100%; }
      .rounded-full { border-radius: 9999px; } .bg-white { background: #fff; }
      .flex { display: flex; } .items-center { align-items: center; } .justify-center { justify-content: center; } .flex-col { flex-direction: column; }
      p.brand { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #6b6b78; margin-top: 28px; }
      h1 { font-size: 26px; margin: 10px 0 8px; }
      p.brief { max-width: 320px; margin: 0 auto; line-height: 1.5; color: #4b4b57; font-size: 14px; }
            /* Experiments phone screens (see src/components/ExperimentScene.jsx) */
      .phone {
        @apply relative h-72 w-40 overflow-hidden rounded-[2.2rem] border-[7px] border-ink bg-white shadow-xl;
      }
      
      .exp-route-car {
        animation: exp-route 4s ease-in-out infinite alternate;
      }
      
      .exp-route-fill {
        width: 60%;
        animation: exp-grow 4s ease-in-out infinite alternate;
      }
      
      .exp-speed {
        animation: exp-speed 1.2s linear infinite;
        animation-delay: calc(var(--i) * -0.2s);
      }
      
      .exp-drop-in {
        animation: exp-drop 4s ease-in infinite;
        animation-delay: calc(var(--i) * 0.7s);
      }
      
      .exp-star {
        color: #e5e7eb;
        animation: exp-star 4s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.3s);
      }
      
      .exp-float {
        animation: exp-float 3.6s ease-out infinite;
        animation-delay: calc(var(--i) * 1.2s);
      }
      
      .exp-shrink {
        animation: exp-shrink 6s linear infinite;
      }
      
      .exp-pop {
        animation: exp-pop 3s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.5s);
      }
      
      @keyframes exp-route {
        from { left: 12%; }
        to { left: 84%; }
      }
      
      @keyframes exp-grow {
        from { width: 10%; }
        to { width: 80%; }
      }
      
      @keyframes exp-speed {
        from { transform: translateX(40%); }
        to { transform: translateX(-40%); }
      }
      
      @keyframes exp-drop {
        0% { transform: translateY(-40px); opacity: 0; }
        20% { opacity: 1; }
        50%, 100% { transform: translateY(70px); opacity: 0; }
      }
      
      @keyframes exp-star {
        0%, 15% { color: #e5e7eb; }
        35%, 100% { color: #f5b301; }
      }
      
      @keyframes exp-float {
        0% { transform: translateY(12px); opacity: 0; }
        25% { opacity: 1; }
        100% { transform: translateY(-50px); opacity: 0; }
      }
      
      @keyframes exp-shrink {
        from { width: 100%; }
        to { width: 0%; }
      }
      
      @keyframes exp-pop {
        0%, 100% { transform: scale(0.6); opacity: 0.3; }
        30%, 70% { transform: scale(1); opacity: 1; }
      }
      
      /* Payments experiments (Paytm, Razorpay, PayU) */
      .exp-scan {
        animation: exp-scan 2.4s ease-in-out infinite;
      }
      
      .exp-paid {
        animation: exp-fade-in 3s ease-in-out infinite;
      }
      
      .exp-select {
        animation: exp-select 3s ease-in-out infinite;
      }
      
      .exp-pay {
        animation: exp-pay 3s ease-in-out infinite;
      }
      
      .exp-status-a { animation: exp-status-a 6s ease-in-out infinite; }
      .exp-status-b { animation: exp-status-b 6s ease-in-out infinite; }
      .exp-status-c { animation: exp-status-c 6s ease-in-out infinite; }
      
      @keyframes exp-scan {
        0% { top: 8px; }
        50% { top: calc(100% - 12px); }
        100% { top: 8px; }
      }
      
      @keyframes exp-fade-in {
        0%, 30% { opacity: 0.2; }
        50%, 100% { opacity: 1; }
      }
      
      @keyframes exp-select {
        0%, 25% { border-color: transparent; }
        40%, 100% { border-color: #e4557f; }
      }
      
      @keyframes exp-pay {
        0%, 40% { background-color: #2e3340; }
        55%, 100% { background-color: #e4557f; }
      }
      
      @keyframes exp-status-a {
        0%, 30% { opacity: 1; }
        36%, 100% { opacity: 0; }
      }
      
      @keyframes exp-status-b {
        0%, 30% { opacity: 0; }
        36%, 58% { opacity: 1; }
        64%, 100% { opacity: 0; }
      }
      
      @keyframes exp-status-c {
        0%, 62% { opacity: 0; }
        68%, 100% { opacity: 1; }
      }
      
      /* Payment ecosystem panel in the hero */
      .flow-node {
        @apply h-3.5 w-3.5 rounded-full border-2 border-pink bg-white;
        animation: flow-pulse 4.5s ease-in-out infinite;
        animation-delay: calc(var(--i) * 1.1s);
      }
      
      .flow-dot {
        @apply absolute h-2 w-2 rounded-full bg-pink;
        top: 50%;
        margin-top: -4px;
        animation: flow-move 4.5s linear infinite;
        animation-delay: calc(var(--i) * -1.5s);
      }
      
      @keyframes flow-pulse {
        0%, 100% { background-color: #fff; }
        12%, 24% { background-color: #e4557f; }
      }
      
      @keyframes flow-move {
        0% { left: 4%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { left: 94%; opacity: 0; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="phone">
        <div class="relative flex items-center justify-center h-full" style="background:#fefce8"><div class="exp-status-a absolute rounded-full" style="background:#ef4444;padding:8px 16px;font-size:11px;font-weight:600;color:#fff">Payment failed</div><div class="exp-status-b absolute rounded-full" style="background:#fbbf24;padding:8px 16px;font-size:11px;font-weight:600;color:#2e3340">Retrying…</div><div class="exp-status-c absolute rounded-full" style="background:#10b981;padding:8px 16px;font-size:11px;font-weight:600;color:#fff">Payment successful</div></div>
      </div>
      <p class="brand">Concept for PayU · not affiliated</p>
      <h1>Failed payments, recovered</h1>
      <p class="brief">A failed payment is retried automatically and ends as a success, so the recovery itself becomes visible to the user.</p>
    </main>
  </body>
</html>
